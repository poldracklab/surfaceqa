<h1>{{ subject.name }}</h1>
<dl class="facts">
<dt>Source</dt><dd>{{ subject.source }}</dd>
<dt>Pipeline</dt><dd>{{ subject.pipeline_label }}</dd>
<dt>Path</dt><dd class="path">{{ subject.path }}</dd>
<dt>Review</dt><dd>{{ subject.review_label | default('Not yet reviewed') }}</dd>
{% if subject.edited %}<dt>Edited</dt><dd>yes: {{ subject.evidence | join("; ") }}</dd>{% endif %}
</dl>
