[project]
name = "surfaceqa"
version = "0.1.0"
description = "Review tool for FreeSurfer and FastSurfer cortical surface reconstructions"
readme = "README.md"
authors = [
    { name = "Russell Poldrack", email = "poldrack@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "jinja2>=3.1.6",
    "nibabel>=5.5.0",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
surfaceqa = "surfaceqa.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
